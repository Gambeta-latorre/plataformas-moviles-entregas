
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>

        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>

                <ul id="lista-productos">
                    <li>Pan <button class="btn btn-danger btn-sm" onclick="eliminarProducto(this)">Eliminar</button></li>
                </ul>

                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-success" onclick="ordenarProductos()">Ordenar A-Z</button>
                    <button class="btn btn-danger" onclick="limpiarLista()">Limpiar Lista</button>
                </div>

                <hr class="hr">

                <h2>Agregar Producto</h2>

                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto" placeholder="Nombre del producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">

        function agregarProducto(nombreProducto) {
            if (nombreProducto.trim() === "") {
                return;
            }

            const lista = document.getElementById('lista-productos');

            const nuevoProducto = document.createElement('li');

            nuevoProducto.textContent = nombreProducto;

            const boton = document.createElement('button');

            boton.textContent = "Eliminar";
            boton.className = "btn btn-danger btn-sm ms-2";

            boton.addEventListener('click', function() {
                eliminarProducto(this);
            });

            nuevoProducto.appendChild(boton);

            lista.appendChild(nuevoProducto);
        }

        function eliminarProducto(boton) {
            boton.parentElement.remove();
        }

        function limpiarLista() {
            document.getElementById('lista-productos').innerHTML = "";
        }

        function ordenarProductos() {
            const lista = document.getElementById('lista-productos');

            const productos = Array.from(lista.children);

            productos.sort(function(a, b) {
                return a.firstChild.textContent.trim().localeCompare(
                    b.firstChild.textContent.trim()
                );
            });

            productos.forEach(function(producto) {
                lista.appendChild(producto);
            });
        }

        function handlerFormulario(evento) {
            evento.preventDefault();

            const input = evento.target.querySelector('input');

            const nombreProducto = input.value;

            agregarProducto(nombreProducto);

            input.value = "";
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);

    </script>
</body>
</html>
