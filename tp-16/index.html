<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex</title>
    <!-- Bootstrap (estilos) desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nuestros estilos propios -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra superior con el título -->
    <nav class="navbar bg-danger mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand text-white fw-bold fs-3">Pokédex</span>
        </div>
    </nav>

    <main class="container">
        <!-- Grilla de cartas (se llena desde app.js).
             Cantidad de columnas según el ancho de pantalla:
             2 en celular, 3 en sm, 4 en md, 6 en pantallas grandes -->
        <div id="grilla" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3"></div>

        <!-- Spinner de carga: oculto por defecto (d-none), JS lo muestra/oculta -->
        <div id="spinner" class="text-center my-4 d-none">
            <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-muted">Cargando pokémon...</p>
        </div>

        <!-- Botón para cargar más pokémon -->
        <div class="text-center my-4">
            <button id="btnMas" class="btn btn-danger btn-lg">Ver más pokémon</button>
        </div>
    </main>

    <!-- Modal (ventana emergente) con la información del pokémon.
         Está vacío: app.js le pone el título y el contenido antes de abrirlo -->
    <div class="modal fade" id="modalPokemon" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="modalCuerpo"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap (JS): necesario para que funcione el modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nuestro código: va al final para que el HTML ya exista cuando se ejecute -->
    <script src="app.js"></script>
</body>
</html>
