
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h1>Editor de Texto</h1>

        <div class="card">
            <div class="card-body">

                <h2>Texto</h2>

                <p id="texto">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                    Donec elementum auctor libero, vel imperdiet est.
                </p>

                <hr>

                <h2>Opciones de Formato</h2>

                <div class="row">
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-negrita" class="btn btn-primary w-100" data-formato="negrita">
                            Bold (Negrita)
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-cursiva" class="btn btn-primary w-100" data-formato="cursiva">
                            Italic (Cursiva)
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-subrayado" class="btn btn-primary w-100" data-formato="subrayado">
                            Underline (Subrayado)
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-color" class="btn btn-primary w-100" data-formato="color">
                            Cambiar color
                        </button>
                    </div>
                </div>

                <hr>

                <h2>Editar texto</h2>

                <input type="text" id="input-texto" class="form-control"
                    placeholder="Escribi un nuevo texto">

                <hr>

                <h2>Tamaño del texto</h2>

                <input type="range" id="tamano" class="form-range"
                    min="12" max="40" value="16">

                <p>Tamaño: <span id="valor-tamano">16</span>px</p>

            </div>
        </div>
    </div>

    <script>
        const texto = document.getElementById('texto');

        function cambiarEstado(boton, activo) {
            if (activo) {
                boton.classList.remove('btn-primary');
                boton.classList.add('btn-success');
            } else {
                boton.classList.remove('btn-success');
                boton.classList.add('btn-primary');
            }
        }

        function funcionNegrita() {
            texto.classList.toggle('fw-bold');

            cambiarEstado(
                document.getElementById('btn-negrita'),
                texto.classList.contains('fw-bold')
            );
        }

        function funcionCursiva() {
            texto.classList.toggle('fst-italic');

            cambiarEstado(
                document.getElementById('btn-cursiva'),
                texto.classList.contains('fst-italic')
            );
        }

        function funcionSubrayado() {
            texto.classList.toggle('text-decoration-underline');

            cambiarEstado(
                document.getElementById('btn-subrayado'),
                texto.classList.contains('text-decoration-underline')
            );
        }

        function funcionColor() {
            if (texto.style.color === 'red') {
                texto.style.color = 'black';
            } else {
                texto.style.color = 'red';
            }

            cambiarEstado(
                document.getElementById('btn-color'),
                texto.style.color === 'red'
            );
        }

        function handlerBoton(e) {
            const funcionBoton = e.currentTarget.dataset.formato;

            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;

                case 'cursiva':
                    funcionCursiva();
                    break;

                case 'subrayado':
                    funcionSubrayado();
                    break;

                case 'color':
                    funcionColor();
                    break;
            }
        }

        document.querySelectorAll('button.btn').forEach(e => {
            e.addEventListener('click', handlerBoton);
        });

        document.getElementById('input-texto').addEventListener('input', function() {
            texto.textContent = this.value;
        });

        document.getElementById('tamano').addEventListener('input', function() {
            texto.style.fontSize = this.value + 'px';

            document.getElementById('valor-tamano').textContent = this.value;
        });
    </script>
</body>
</html>
