
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Contactos</h1>

        <div class="card">
            <div class="card-body">
                <h2>Contactos</h2>

                <div class="mb-3">
                    <label for="ordenar">Ordenar por:</label>
                    <select id="ordenar" class="form-select">
                        <option value="nombre">Nombre</option>
                        <option value="apellido">Apellido</option>
                    </select>
                </div>

                <div class="mb-3">
                    <button id="btn-todos" class="btn btn-primary">
                        Todos los contactos
                    </button>

                    <button id="btn-favoritos" class="btn btn-warning">
                        Solo favoritos
                    </button>
                </div>

                <ul id="lista-contactos" class="list-group"></ul>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>

                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="nombre"
                            id="input-nombre" placeholder="Nombre">

                        <input type="text" class="form-control" name="apellido"
                            id="input-apellido" placeholder="Apellido">

                        <input type="tel" class="form-control" name="telefono"
                            id="input-telefono" placeholder="Teléfono">
                    </div>

                    <button class="btn btn-primary" type="submit">
                        Agregar Contacto
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/javascript">

        let contactos = [
            {
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '1123456789',
                favorito: false
            },
        ];

        let mostrarFavoritos = false;
        let orden = 'nombre';

        function agregarContacto(nombre, apellido, telefono) {
            if (nombre.trim() === '' || apellido.trim() === '' || telefono.trim() === '') {
                return;
            }

            contactos.push({
                nombre: nombre,
                apellido: apellido,
                telefono: telefono,
                favorito: false
            });

            mostrarListado();
        }

        function mostrarListado() {
            const lista = document.getElementById('lista-contactos');

            lista.innerHTML = '';

            let listado = contactos.slice();

            listado.sort(function(a, b) {
                return a[orden].localeCompare(b[orden]);
            });

            listado.forEach(function(contacto) {

                if (mostrarFavoritos && !contacto.favorito) {
                    return;
                }

                const li = document.createElement('li');

                li.className = 'list-group-item d-flex justify-content-between align-items-center';

                const informacion = document.createElement('span');

                informacion.textContent = contacto.nombre + ' ' +
                    contacto.apellido + ' - Tel: ' + contacto.telefono;

                const botones = document.createElement('div');

                const favorito = document.createElement('button');

                favorito.className = 'btn btn-warning btn-sm me-2';

                favorito.textContent = contacto.favorito ? 'Quitar favorito' : 'Favorito';

                favorito.addEventListener('click', function() {
                    contacto.favorito = !contacto.favorito;
                    mostrarListado();
                });

                botones.appendChild(favorito);

                li.appendChild(informacion);
                li.appendChild(botones);

                lista.appendChild(li);
            });
        }

        function handlerFormulario(e) {
            e.preventDefault();

            const inputNombre = e.target.querySelector('#input-nombre');
            const inputApellido = e.target.querySelector('#input-apellido');
            const inputTelefono = e.target.querySelector('#input-telefono');

            const nombre = inputNombre.value;
            const apellido = inputApellido.value;
            const telefono = inputTelefono.value;

            agregarContacto(nombre, apellido, telefono);

            inputNombre.value = '';
            inputApellido.value = '';
            inputTelefono.value = '';
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);

        document.getElementById('ordenar').addEventListener('change', function() {
            orden = this.value;
            mostrarListado();
        });

        document.getElementById('btn-todos').addEventListener('click', function() {
            mostrarFavoritos = false;
            mostrarListado();
        });

        document.getElementById('btn-favoritos').addEventListener('click', function() {
            mostrarFavoritos = true;
            mostrarListado();
        });

        mostrarListado();

    </script>
</body>
</html>
